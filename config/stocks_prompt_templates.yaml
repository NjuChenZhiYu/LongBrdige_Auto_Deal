hk_market_report:
  active: hk_market_intraday_v20260623
  templates:
    hk_market_v20260623:
      description: 港股多股票市场快报模板，结合资金博弈与 EMA 量化技术面输出市场综述、热点、重点个股和交易策略。
      output_rules: |-
        请严格按照以下结构和字数要求，生成一份专业的市场快报：
        1. **市场综述**（80-100字）：基于涨跌分布判断市场整体情绪。
        2. **板块热点**（80-100字）：识别是否有机器人、物流、航天、能源、半导体等板块的集中异动。
        3. **重点个股深度剖析**（200-350字）：必须将【内部量化系统研判】（代表真实的资金博弈，如主力洗盘、机构出逃）与【量化技术面】（基于多周期EMA均线与乖离率的数学引擎结果，如V型反转预备、长短共振等）结合分析。深度点评主力和散户的博弈状态，刺穿涨跌幅的表象。若出现左侧极端信号（如极度超跌）或右侧共振信号，需重点提示其背后的均值回归或顺势加速逻辑。
        4. **具体交易策略**（100-150字）：拒绝宏观套话（如“谨慎乐观”、“重个股轻指数”），必须**直接点名上述异动标的**给出具体的实操建议。明确指出哪些标的（结合资金数据与技术面信号）可顺势跟多或左侧抄底，哪些标的（如机构出逃或估值透支）存在诱多风险需坚决规避或逢高做空，哪些建议观望。要求观点鲜明、一针见血。

        语言要求：专业、简洁、有港股特色，使用 Markdown 格式，字数350-450字。
    hk_market_intraday_v20260623:
      description: 港股自选股盘中异动快报模板，结合资金博弈、涨跌幅与 EMA 量化技术面输出盘面状态、重点异动分层和交易策略。
      output_rules: |-
        请严格按照以下结构生成一份盘中自选股异动快报：
        1. **盘面状态判断**（80-120字）：基于上涨/下跌家数、平均涨跌幅、触发阈值，判断当前自选股池是风险偏好扩散、结构分化，还是资金退潮。不得泛泛描述大盘或行业板块，只分析本次输入标的。
        2. **重点异动分层**（220-320字）：必须按交易价值分为三类：
           - 可右侧跟踪：change_rate为正，主力净流入，且tag_combined显示转多、长短共振、放量确认或趋势延续的标的。
           - 可左侧观察：bias20显著为负，tag_combined显示跌势放缓/缩量/左侧观察，但资金尚未完全确认的标的。
           - 高风险回避：主力明显流出、散户接盘、放量转空、上行降速且bias20偏高、数据不足或杠杆产品剧烈波动的标的。
           每只重点标的必须引用至少两个字段作为依据：change_rate、主力/散户净流、tag_combined、V5、V20、A5、bias20。
        3. **具体交易策略**（150-220字）：必须直接点名标的，不得使用“谨慎乐观”“重个股轻指数”等宏观套话。输出应包含：今日可优先跟踪的1-2只标的及仓位态度；只适合观察、不宜追的标的；明确需要回避或减仓的标的；对左侧票必须说明“等待资金转强或结构确认”，对右侧票必须说明“避免追高，关注V20/量能/回踩确认”。

        语言要求：专业、简洁、有港股盘中特色，使用 Markdown 格式，字数450-600字。
